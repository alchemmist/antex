[package]
name = "antex-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "antex"
path = "src/main.rs"

[dependencies]
antex-core = { path = "../core" }
antex-extension-host = { path = "../extension-host" }
antex-extension-protocol = { path = "../extension-protocol" }
antex-provider-openai = { path = "../provider-openai" }
antex-runtime = { path = "../runtime" }
antex-tui = { path = "../tui" }
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
futures.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "signal"] }
tokio-util.workspace = true
serde_json.workspace = true
toml = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
insta = "1"
tempfile = "3"
pretty_assertions = "1"
