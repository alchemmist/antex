name: alchemmist-release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: antex-rs
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: "off"
      CARGO_TARGET_DIR: ${{ github.workspace }}/antex-rs/target
      TARGET: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-15
            target: aarch64-apple-darwin
            platform: mac
          - name: Linux x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          targets: ${{ matrix.target }}

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag_version="${GITHUB_REF_NAME#v}"
          fork_version="$(tr -d '[:space:]' < ../FORK_VERSION)"
          [[ "${tag_version}" == "${fork_version}" ]]

      - name: Configure rusty_v8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}

      - name: Build Antex
        shell: bash
        run: |
          export STABLE_GIT_COMMIT="${GITHUB_SHA::8}"
          ALCHEMMIST_FORK_VERSION="$(tr -d '[:space:]' < ../FORK_VERSION)"
          export ALCHEMMIST_FORK_VERSION
          cargo build --locked --release --target "${TARGET}" \
            --bin antex \
            --bin antex-code-mode-host
          if [[ "${TARGET}" == *linux* ]]; then
            cargo build --locked --release --target "${TARGET}" -p antex-bwrap --bin bwrap
          fi

      - name: Package Antex
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          archive="antex-${TARGET}.tar.gz"
          staging="${RUNNER_TEMP}/antex-${TARGET}"
          mkdir -p "${staging}"
          cp "${CARGO_TARGET_DIR}/${TARGET}/release/antex" "${staging}/antex"
          cp "${CARGO_TARGET_DIR}/${TARGET}/release/antex-code-mode-host" \
            "${staging}/antex-code-mode-host"
          strip "${staging}/antex" "${staging}/antex-code-mode-host"
          if [[ "${PLATFORM}" == "mac" ]]; then
            codesign --force --sign - "${staging}/antex"
            codesign --force --sign - "${staging}/antex-code-mode-host"
          fi
          python3 ../scripts/smoke-code-mode-host.py "${staging}/antex-code-mode-host"
          if [[ "${PLATFORM}" == "linux" ]]; then
            mkdir -p "${staging}/antex-resources"
            cp "${CARGO_TARGET_DIR}/${TARGET}/release/bwrap" "${staging}/antex-resources/bwrap"
          fi
          tar -C "${staging}" -czf "${RUNNER_TEMP}/${archive}" .
          if [[ "${PLATFORM}" == "mac" ]]; then
            (cd "${RUNNER_TEMP}" && shasum -a 256 "${archive}" > "${archive}.sha256")
          else
            (cd "${RUNNER_TEMP}" && sha256sum "${archive}" > "${archive}.sha256")
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/antex-${{ matrix.target }}.tar.gz
            ${{ runner.temp }}/antex-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: dist/*
