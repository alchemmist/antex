name: alchemmist-release

on:
  push:
    branches: [main]
    paths:
      - "Makefile"
      - "scripts/**"
      - "third_party/voice/**"
      - ".github/workflows/alchemmist-release.yml"
    tags:
      - "v*.*.*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: "off"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-15
            target: aarch64-apple-darwin
            platform: mac
          - name: Linux x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86
        with:
          bazelisk-version: 1.28.1
          disk-cache: true
          repository-cache: true

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          targets: ${{ matrix.target }}

      - uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            antex-rs/target
          key: fork-package-${{ matrix.target }}-${{ hashFiles('antex-rs/Cargo.lock', 'antex-rs/rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            fork-package-${{ matrix.target }}-${{ hashFiles('antex-rs/Cargo.lock', 'antex-rs/rust-toolchain.toml') }}-

      - name: Configure rusty_v8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" == "v$(tr -d '[:space:]' < FORK_VERSION)" ]]

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends zsh patchelf pkg-config libcap-dev

      - name: Build release executables
        working-directory: antex-rs
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          STABLE_GIT_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          export ALCHEMMIST_FORK_VERSION="$(tr -d '[:space:]' < ../FORK_VERSION)"
          cargo build --locked --release --target "$TARGET" --bin antex --bin antex-code-mode-host
          if [[ "$TARGET" == *linux* ]]; then
            cargo build --locked --release --target "$TARGET" -p antex-bwrap --bin bwrap
          fi

      - name: Save release build cache
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            antex-rs/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

      - name: Build native voice resources
        shell: bash
        env:
          ANTEX_BUILD_COMMIT: ${{ github.sha }}
        run: |
          flags=()
          if [[ "$RUNNER_OS" == Linux ]]; then
            flags+=(--platforms=//:local_linux)
          fi
          bazel build --jobs=3 --stamp --workspace_status_command="python3 scripts/workspace-status.py" \
            -c opt "${flags[@]}" //antex-rs/voice-host:antex-voice-host //third_party/voice:native_runtime

      - name: Assemble complete release package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ANTEX_REPO_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          binaries="$GITHUB_WORKSPACE/antex-rs/target/$TARGET/release"
          command=(python3 scripts/package-fork.py --target "$TARGET" --commit "$GITHUB_SHA"
            --output "$RUNNER_TEMP/package" --release
            --entrypoint-bin "$binaries/antex" --code-mode-host-bin "$binaries/antex-code-mode-host")
          if [[ "$TARGET" == *linux* ]]; then
            command+=(--bwrap-bin "$binaries/bwrap")
          fi
          "${command[@]}"

      - name: Validate installed package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          python3 scripts/install-fork-package.py "$RUNNER_TEMP/package" "$RUNNER_TEMP/installed/bin" "$TARGET"
          "$RUNNER_TEMP/installed/bin/antex" --help > /dev/null
          python3 scripts/smoke-code-mode-host.py "$RUNNER_TEMP/installed/bin/antex-code-mode-host"
          python3 scripts/smoke-voice-package.py "$RUNNER_TEMP/installed/bin/antex" "$GITHUB_SHA"
          python3 scripts/smoke-tui-voice.py "$RUNNER_TEMP/installed/bin/antex"
          python3 scripts/smoke-daemon-package.py "$RUNNER_TEMP/installed/bin/antex"
          python3 -m unittest discover -s scripts -p 'test_install_fork_package.py'
          python3 -m unittest discover -s scripts/install -p 'test_install_sh.py'
          python3 -m unittest discover -s third_party/voice -p 'test_assemble_package.py'
          cd "$RUNNER_TEMP"
          python3 - "$TARGET" <<'PYTHON'
          import hashlib
          import pathlib
          import sys
          for name in (f"antex-{sys.argv[1]}.tar.gz", f"antex-package-{sys.argv[1]}.tar.gz"):
              archive = pathlib.Path(name)
              archive.with_suffix(archive.suffix + ".sha256").write_text(
                  hashlib.sha256(archive.read_bytes()).hexdigest() + "  " + archive.name + "\n"
              )
          PYTHON

      - name: Upload release artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/antex-${{ matrix.target }}.tar.gz
            ${{ runner.temp }}/antex-${{ matrix.target }}.tar.gz.sha256
            ${{ runner.temp }}/antex-package-${{ matrix.target }}.tar.gz
            ${{ runner.temp }}/antex-package-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Assemble package checksums
        run: cat dist/antex-package-*.tar.gz.sha256 > dist/antex-package_SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: dist/*
