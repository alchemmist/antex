name: alchemmist-release

on:
  push:
    branches: [main]
    paths:
      - "Makefile"
      - "scripts/**"
      - "third_party/voice/**"
      - ".github/workflows/alchemmist-release.yml"
    tags:
      - "v*.*.*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-15
            target: aarch64-apple-darwin
            platform: mac
            make_target: package-macos-arm64
          - name: Linux x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            make_target: package-linux

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86
        with:
          bazelisk-version: 1.28.1

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" == "v$(tr -d '[:space:]' < FORK_VERSION)" ]]

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends zsh patchelf

      - name: Build complete package
        shell: bash
        env:
          MAKE_TARGET: ${{ matrix.make_target }}
        run: |
          make "$MAKE_TARGET" ANTEX_BUILD_COMMIT="$GITHUB_SHA" \
            ANTEX_PACKAGE_DIR="$RUNNER_TEMP/package" \
            ANTEX_PACKAGE_FLAGS=--release ANTEX_BAZEL_BUILD_FLAGS=--jobs=3

      - name: Validate installed package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          python3 scripts/install-fork-package.py "$RUNNER_TEMP/package" "$RUNNER_TEMP/installed/bin" "$TARGET"
          "$RUNNER_TEMP/installed/bin/antex" --help > /dev/null
          python3 scripts/smoke-code-mode-host.py "$RUNNER_TEMP/installed/bin/antex-code-mode-host"
          python3 scripts/smoke-voice-package.py "$RUNNER_TEMP/installed/bin/antex" "$GITHUB_SHA"
          python3 scripts/smoke-tui-voice.py "$RUNNER_TEMP/installed/bin/antex"
          python3 -m unittest discover -s scripts -p 'test_install_fork_package.py'
          python3 -m unittest discover -s third_party/voice -p 'test_assemble_package.py'
          cd "$RUNNER_TEMP"
          python3 - "$TARGET" <<'PYTHON'
          import hashlib
          import pathlib
          import sys
          archive = pathlib.Path(f"antex-{sys.argv[1]}.tar.gz")
          archive.with_suffix(archive.suffix + ".sha256").write_text(
              hashlib.sha256(archive.read_bytes()).hexdigest() + "  " + archive.name + "\n"
          )
          PYTHON

      - name: Upload release artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/antex-${{ matrix.target }}.tar.gz
            ${{ runner.temp }}/antex-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: dist/*
