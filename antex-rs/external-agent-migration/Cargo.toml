[package]
name = "antex-external-agent-migration"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
doctest = false
name = "antex_external_agent_migration"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
chrono = { workspace = true }
antex-analytics = { workspace = true }
antex-config = { workspace = true }
antex-core = { workspace = true }
antex-core-plugins = { workspace = true }
antex-hooks = { workspace = true }
antex-login = { workspace = true }
antex-memories-write = { workspace = true }
antex-otel = { workspace = true }
antex-plugin = { workspace = true }
antex-protocol = { workspace = true }
antex-rollout = { workspace = true }
antex-thread-store = { workspace = true }
antex-utils-output-truncation = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
tracing = { workspace = true }

[dev-dependencies]
antex-app-server-protocol = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
