[package]
edition.workspace = true
license.workspace = true
name = "antex-memories-write"
version.workspace = true

[lib]
name = "antex_memories_write"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
antex-backend-client = { workspace = true }
antex-core = { workspace = true }
antex-config = { workspace = true }
antex-features = { workspace = true }
antex-git-utils = { workspace = true }
antex-login = { workspace = true }
antex-model-provider = { workspace = true }
antex-otel = { workspace = true }
antex-protocol = { workspace = true }
antex-rollout = { workspace = true }
antex-rollout-trace = { workspace = true }
antex-secrets = { workspace = true }
antex-state = { workspace = true }
antex-terminal-detection = { workspace = true }
antex-utils-absolute-path = { workspace = true }
antex-utils-output-truncation = { workspace = true }
antex-utils-template = { workspace = true }
futures = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "rt", "sync", "time"] }
tracing = { workspace = true, features = ["log"] }
uuid = { workspace = true, features = ["v4", "v5"] }

[dev-dependencies]
antex-model-provider-info = { workspace = true }
antex-models-manager = { workspace = true }
core_test_support = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros"] }
wiremock = { workspace = true }
