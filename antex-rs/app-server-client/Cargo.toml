[package]
name = "antex-app-server-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "antex_app_server_client"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
antex-app-server = { workspace = true }
antex-app-server-protocol = { workspace = true }
antex-arg0 = { workspace = true }
antex-config = { workspace = true }
antex-core = { workspace = true }
antex-exec-server = { workspace = true }
antex-feedback = { workspace = true }
antex-protocol = { workspace = true }
antex-uds = { workspace = true }
antex-utils-absolute-path = { workspace = true }
antex-utils-rustls-provider = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt"] }
tokio-tungstenite = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
