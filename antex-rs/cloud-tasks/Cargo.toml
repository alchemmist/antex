[package]
edition.workspace = true
license.workspace = true
name = "antex-cloud-tasks"
version.workspace = true

[lib]
name = "antex_cloud_tasks"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true, features = ["derive"] }
antex-http-client = { workspace = true }
antex-cloud-tasks-client = { workspace = true }
# TODO: antex-cloud-tasks-mock-client should be in dev-dependencies.
antex-cloud-tasks-mock-client = { workspace = true }
antex-core = { workspace = true }
antex-git-utils = { workspace = true }
antex-login = { path = "../login" }
antex-model-provider = { workspace = true }
antex-tui = { workspace = true }
antex-utils-cli = { workspace = true }
crossterm = { workspace = true, features = ["event-stream"] }
http = { workspace = true }
owo-colors = { workspace = true, features = ["supports-colors"] }
ratatui = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
supports-color = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-stream = { workspace = true }
tracing = { workspace = true, features = ["log"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
unicode-segmentation = { workspace = true }
unicode-width = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
pretty_assertions = { workspace = true }
