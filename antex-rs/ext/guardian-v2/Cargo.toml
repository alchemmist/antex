[package]
edition.workspace = true
license.workspace = true
name = "antex-guardian-v2"
version.workspace = true

[lib]
name = "antex_guardian_v2"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
antex-analytics = { workspace = true }
antex-api = { workspace = true }
antex-core = { workspace = true }
antex-extension-api = { workspace = true }
antex-features = { workspace = true }
antex-guardian-context = { workspace = true }
antex-history = { workspace = true }
antex-http-client = { workspace = true }
antex-login = { workspace = true }
antex-model-provider = { workspace = true }
antex-models-manager = { workspace = true }
antex-network-proxy = { workspace = true }
antex-protocol = { workspace = true }
dirs = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
antex-model-provider-info = { workspace = true }
core_test_support = { workspace = true }
pretty_assertions = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
