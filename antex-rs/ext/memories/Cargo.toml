[package]
edition.workspace = true
license.workspace = true
name = "antex-memories-extension"
version.workspace = true

[lib]
name = "antex_memories_extension"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
antex-core = { workspace = true }
antex-extension-api = { workspace = true }
antex-features = { workspace = true }
antex-otel = { workspace = true }
antex-protocol = { workspace = true }
antex-tools = { workspace = true }
antex-utils-absolute-path = { workspace = true }
antex-utils-output-truncation = { workspace = true }
antex-utils-template = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros"] }
