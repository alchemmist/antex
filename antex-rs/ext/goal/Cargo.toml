[package]
edition.workspace = true
license.workspace = true
name = "antex-goal-extension"
version.workspace = true

[lib]
name = "antex_goal_extension"
path = "src/lib.rs"
test = false
doctest = false

[lints]
workspace = true

[dependencies]
antex-analytics = { workspace = true }
antex-core = { workspace = true }
antex-extension-api = { workspace = true }
antex-otel = { workspace = true }
antex-protocol = { workspace = true }
antex-rollout = { workspace = true }
antex-state = { workspace = true }
antex-tools = { workspace = true }
antex-utils-template = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
antex-utils-absolute-path = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
