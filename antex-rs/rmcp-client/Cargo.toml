[package]
name = "antex-rmcp-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1"
axum = { workspace = true, default-features = false, features = [
    "http1",
    "json",
    "tokio",
] }
base64 = { workspace = true }
antex-api = { workspace = true }
antex-config = { workspace = true }
antex-exec-server = { workspace = true }
antex-http-client = { workspace = true }
antex-keyring-store = { workspace = true }
antex-network-proxy = { workspace = true }
antex-otel = { workspace = true }
antex-protocol = { workspace = true }
antex-secrets = { workspace = true }
antex-utils-path-uri = { workspace = true }
antex-utils-pty = { workspace = true }
antex-utils-home-dir = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true, default-features = false, features = ["std"] }
http = { workspace = true }
keyring = { workspace = true, features = ["crypto-rust"] }
memchr = { workspace = true }
oauth2 = "5"
rmcp = { workspace = true, default-features = false, features = [
    "auth-enterprise-managed",
    "base64",
    "client",
    "macros",
    "schemars",
    "server",
    "transport-async-rw",
    "transport-child-process",
    "transport-streamable-http-client",
    "transport-streamable-http-server",
] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
sse-stream = "0.2.5"
tempfile = { workspace = true }
thiserror = { workspace = true }
tiny_http = { workspace = true }
tokio = { workspace = true, features = [
    "io-util",
    "macros",
    "process",
    "signal",
    "rt-multi-thread",
    "sync",
    "io-std",
    "time",
] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true, features = ["log"] }
url = { workspace = true }
urlencoding = { workspace = true }
webbrowser = { workspace = true }
which = { workspace = true }

[dev-dependencies]
opentelemetry_sdk = { workspace = true, features = ["testing"] }
antex-http-client = { workspace = true }
antex-utils-cargo-bin = { workspace = true }
pretty_assertions = { workspace = true }
serial_test = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-test = { workspace = true, features = ["no-env-filter"] }
wiremock = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["linux-native-async-persistent"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }

[target.'cfg(any(target_os = "freebsd", target_os = "openbsd"))'.dependencies]
keyring = { workspace = true, features = ["sync-secret-service"] }

# These tests are compiled through `#[path]` inside the inline `oauth::tests` module. Cargo-shear
# cannot resolve those nested module paths and otherwise reports the linked files as unlinked.
[package.metadata.cargo-shear]
ignored-paths = [
    "src/oauth/tests/persistor_tests.rs",
    "src/oauth/tests/credential_store_tests.rs",
    "src/oauth/tests/telemetry_tests.rs",
]

[lib]
doctest = false
